<section class="space-y-6" id="records-root">

  <!-- Header -->
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Records</p>
      <h2 class="mt-1 text-3xl font-bold text-slate-950">My Sections</h2>
      <p class="mt-1 text-sm text-slate-500">Manage class sections, groups, and student records.</p>
    </div>
    <button id="btn-add-section"
            class="flex items-center gap-2 px-4 py-2.5 bg-blue-900 text-white text-sm font-bold rounded-xl hover:bg-blue-800 transition-colors shadow-sm">
      <span class="material-symbols-outlined text-base">add</span>
      Add Section
    </button>
  </div>

  <!-- Sections list (loaded via JS) -->
  <div id="sections-list" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    <div class="col-span-full flex items-center justify-center py-16 text-slate-400">
      <div class="text-center space-y-2">
        <span class="material-symbols-outlined text-5xl block" style="font-variation-settings:'FILL' 0">folder_open</span>
        <p class="text-sm font-medium">Loading sections…</p>
      </div>
    </div>
  </div>

  <!-- ── ADD SECTION MODAL ── -->
  <div id="modal-add-section"
       class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-900">Add New Section</h3>
        <button id="btn-modal-close" class="text-slate-400 hover:text-slate-700 transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Step 1: Section info -->
      <div id="modal-step-1" class="p-6 space-y-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-500" for="sec-name">Section Name</label>
          <input id="sec-name" type="text" placeholder="e.g. BSIT 3-5"
                 class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500" for="sec-year">School Year</label>
            <input id="sec-year" type="text" placeholder="2024-2025"
                   class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500" for="sec-sem">Semester</label>
            <select id="sec-sem"
                    class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 bg-white">
              <option value="">— Select —</option>
              <option value="1st">1st Semester</option>
              <option value="2nd">2nd Semester</option>
              <option value="Summer">Summer</option>
            </select>
          </div>
        </div>
        <div id="step1-error" class="hidden text-sm text-red-600 font-medium"></div>
        <button id="btn-step1-next"
                class="w-full py-2.5 bg-blue-900 text-white text-sm font-bold rounded-xl hover:bg-blue-800 transition-colors">
          Next: Import Students →
        </button>
      </div>

      <!-- Step 2: CSV Upload -->
      <div id="modal-step-2" class="hidden p-6 space-y-4">
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs text-blue-800 space-y-1">
          <p class="font-bold">Required CSV columns:</p>
          <p class="font-mono">student_number, surname, first_name, middle_initial, email, group_number, group_name</p>
        </div>
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-xl p-8 cursor-pointer hover:border-blue-400 transition-colors gap-2">
          <span class="material-symbols-outlined text-4xl text-slate-400">upload_file</span>
          <span class="text-sm font-medium text-slate-600">Click to choose CSV file</span>
          <span id="csv-filename" class="text-xs text-slate-400">No file selected</span>
          <input id="csv-file" type="file" accept=".csv" class="hidden"/>
        </label>
        <div id="step2-error" class="hidden text-sm text-red-600 font-medium"></div>
        <div class="flex gap-3">
          <button id="btn-step2-back"
                  class="flex-1 py-2.5 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors">
            ← Back
          </button>
          <button id="btn-step2-import"
                  class="flex-1 py-2.5 bg-blue-900 text-white text-sm font-bold rounded-xl hover:bg-blue-800 transition-colors">
            Import & Create
          </button>
        </div>
      </div>

      <!-- Step 3: Result -->
      <div id="modal-step-3" class="hidden p-6 space-y-4">
        <div class="text-center space-y-2 pb-2">
          <span class="material-symbols-outlined text-5xl text-teal-500" style="font-variation-settings:'FILL' 1">check_circle</span>
          <h4 class="font-bold text-slate-900">Section Created!</h4>
          <p id="import-summary" class="text-sm text-slate-500"></p>
        </div>
        <div id="import-errors" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 space-y-1 max-h-32 overflow-y-auto"></div>
        <button id="btn-step3-done"
                class="w-full py-2.5 bg-blue-900 text-white text-sm font-bold rounded-xl hover:bg-blue-800 transition-colors">
          Done
        </button>
      </div>
    </div>
  </div>

</section>

<script>
(function() {
  // ── helpers ──────────────────────────────────────────────────────────────
  function qs(sel, root) { return (root || document).querySelector(sel); }

  // ── Load sections ────────────────────────────────────────────────────────
  async function loadSections() {
    const list = qs('#sections-list');
    try {
      const res = await fetch('/api/sections');
      const data = await res.json();
      if (!data.success || !data.sections.length) {
        list.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400">
            <span class="material-symbols-outlined text-6xl block mb-3" style="font-variation-settings:'FILL' 0">folder_open</span>
            <p class="font-semibold text-slate-500">No sections yet</p>
            <p class="text-sm mt-1">Click <strong>Add Section</strong> to get started.</p>
          </div>`;
        return;
      }
      list.innerHTML = data.sections.map(s => `
        <article class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group"
                 onclick="window.loadSectionDetail(${s.id}, ${JSON.stringify(s.name).replace(/"/g,"&quot;")})">
          <div class="flex items-start justify-between gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-900 shrink-0">
              <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">class</span>
            </div>
            <span class="text-xs font-semibold text-teal-600 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded-full whitespace-nowrap">
              ${s.semester || ''} ${s.school_year || ''}
            </span>
          </div>
          <h3 class="mt-3 text-lg font-bold text-slate-900 group-hover:text-blue-900 transition-colors">${s.name}</h3>
          <div class="mt-2 flex items-center gap-4 text-xs text-slate-500">
            <span class="flex items-center gap-1">
              <span class="material-symbols-outlined text-sm">group</span>${s.group_count} group${s.group_count !== 1 ? 's' : ''}
            </span>
            <span class="flex items-center gap-1">
              <span class="material-symbols-outlined text-sm">person</span>${s.student_count} student${s.student_count !== 1 ? 's' : ''}
            </span>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
            <span>View groups →</span>
          </div>
        </article>`).join('');
    } catch(e) {
      list.innerHTML = `<div class="col-span-full text-sm text-red-500 p-4">Failed to load sections: ${e.message}</div>`;
    }
  }

  // ── Load section detail (groups) ────────────────────────────────────────
  window.loadSectionDetail = async function(sectionId, sectionName) {
    const root = qs('#records-root');
    root.innerHTML = `<div class="flex items-center justify-center py-20 text-slate-400">
      <span class="material-symbols-outlined animate-spin text-4xl">progress_activity</span></div>`;
    try {
      const res = await fetch(`/api/sections/${sectionId}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      renderGroups(data.section, data.groups);
    } catch(e) {
      root.innerHTML = `<div class="text-red-500 p-4">${e.message}</div>`;
    }
  };

  function renderGroups(section, groups) {
    const root = qs('#records-root');
    root.innerHTML = `
      <div class="space-y-6">
        <div class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
          <button onclick="window.reloadRecords()" class="hover:text-blue-900 font-medium transition-colors">Records</button>
          <span class="material-symbols-outlined text-sm">chevron_right</span>
          <span class="font-bold text-slate-900">${section.name}</span>
          <span class="ml-auto text-xs text-slate-400">${section.semester || ''} ${section.school_year || ''}</span>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
            <h3 class="font-bold text-slate-800">Groups</h3>
            <span class="text-xs text-slate-500">${groups.length} group${groups.length !== 1 ? 's' : ''}</span>
          </div>
          ${groups.length === 0 ? `
            <div class="flex flex-col items-center justify-center py-16 text-slate-400">
              <span class="material-symbols-outlined text-5xl mb-2">group_off</span>
              <p class="text-sm">No groups in this section.</p>
            </div>` : `
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
              <tr>
                <th class="px-5 py-3 text-left">Group #</th>
                <th class="px-5 py-3 text-left">Group Name</th>
                <th class="px-5 py-3 text-left">Members</th>
                <th class="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody>
              ${groups.map(g => `
              <tr class="border-t border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors"
                  onclick="window.loadGroupDetail(${g.id}, '${section.name}', ${section.id})">
                <td class="px-5 py-3.5 font-bold text-blue-900">Group ${g.group_number}</td>
                <td class="px-5 py-3.5 font-medium">${g.group_name}</td>
                <td class="px-5 py-3.5 text-slate-500">${g.member_count} student${g.member_count !== 1 ? 's' : ''}</td>
                <td class="px-5 py-3.5 text-right">
                  <span class="text-xs text-blue-700 font-semibold hover:underline">View →</span>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        </div>
      </div>`;
  }

  // ── Load group members ───────────────────────────────────────────────────
  window.loadGroupDetail = async function(groupId, sectionName, sectionId) {
    const root = qs('#records-root');
    root.innerHTML = `<div class="flex items-center justify-center py-20 text-slate-400">
      <span class="material-symbols-outlined animate-spin text-4xl">progress_activity</span></div>`;
    try {
      const res = await fetch(`/api/groups/${groupId}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      renderMembers(data.group, data.members, sectionId);
    } catch(e) {
      root.innerHTML = `<div class="text-red-500 p-4">${e.message}</div>`;
    }
  };

  function renderMembers(group, members, sectionId) {
    const root = qs('#records-root');
    root.innerHTML = `
      <div class="space-y-6">
        <div class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
          <button onclick="window.reloadRecords()" class="hover:text-blue-900 font-medium transition-colors">Records</button>
          <span class="material-symbols-outlined text-sm">chevron_right</span>
          <button onclick="window.loadSectionDetail(${sectionId}, '')" class="hover:text-blue-900 font-medium transition-colors">${group.section_name}</button>
          <span class="material-symbols-outlined text-sm">chevron_right</span>
          <span class="font-bold text-slate-900">Group ${group.group_number} — ${group.group_name}</span>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
            <h3 class="font-bold text-slate-800">Members</h3>
            <span class="text-xs text-slate-500">${members.length} student${members.length !== 1 ? 's' : ''}</span>
          </div>
          ${members.length === 0 ? `
            <div class="flex flex-col items-center justify-center py-16 text-slate-400">
              <span class="material-symbols-outlined text-5xl mb-2">person_off</span>
              <p class="text-sm">No students in this group.</p>
            </div>` : `
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
              <tr>
                <th class="px-5 py-3 text-left">Student #</th>
                <th class="px-5 py-3 text-left">Name</th>
                <th class="px-5 py-3 text-left">Email</th>
                <th class="px-5 py-3 text-left">Temp Password</th>
                <th class="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody>
              ${members.map(m => `
              <tr class="border-t border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors"
                  onclick="window.loadStudentCard(${m.id})">
                <td class="px-5 py-3.5 font-mono text-xs text-slate-600">${m.stud_number}</td>
                <td class="px-5 py-3.5 font-semibold">${m.surname}, ${m.first_name}${m.middle_initial ? ' ' + m.middle_initial + '.' : ''}</td>
                <td class="px-5 py-3.5 text-slate-500">${m.email}</td>
                <td class="px-5 py-3.5">
                  ${m.is_first_login
                    ? `<span class="font-mono text-xs bg-amber-50 border border-amber-200 text-amber-800 px-2 py-1 rounded-lg">${m.temp_password || '—'}</span>`
                    : `<span class="text-xs text-teal-600 font-semibold flex items-center gap-1"><span class="material-symbols-outlined text-sm">check_circle</span>Set</span>`}
                </td>
                <td class="px-5 py-3.5 text-right">
                  <span class="text-xs text-blue-700 font-semibold hover:underline">View Card →</span>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        </div>
      </div>`;
  }

  // ── Reload records page ──────────────────────────────────────────────────
  window.reloadRecords = function() {
    const root = qs('#records-root');
    root.innerHTML = '';
    // Re-fetch the records partial
    fetch('/partials/records').then(r => r.text()).then(html => {
      root.outerHTML = html;
    });
  };

  // ── Modal logic ──────────────────────────────────────────────────────────
  let createdSectionId = null;

  qs('#btn-add-section').addEventListener('click', () => {
    qs('#modal-add-section').classList.remove('hidden');
    qs('#modal-step-1').classList.remove('hidden');
    qs('#modal-step-2').classList.add('hidden');
    qs('#modal-step-3').classList.add('hidden');
    qs('#step1-error').classList.add('hidden');
    qs('#sec-name').value = '';
    qs('#sec-year').value = '';
    qs('#sec-sem').value = '';
    createdSectionId = null;
  });

  qs('#btn-modal-close').addEventListener('click', () => qs('#modal-add-section').classList.add('hidden'));
  qs('#modal-add-section').addEventListener('click', (e) => {
    if (e.target === qs('#modal-add-section')) qs('#modal-add-section').classList.add('hidden');
  });

  qs('#btn-step1-next').addEventListener('click', async () => {
    const name = qs('#sec-name').value.trim();
    const year = qs('#sec-year').value.trim();
    const sem  = qs('#sec-sem').value.trim();
    const errEl = qs('#step1-error');
    if (!name) { errEl.textContent = 'Section name is required.'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');
    const btn = qs('#btn-step1-next');
    btn.textContent = 'Creating…'; btn.disabled = true;
    try {
      const res = await fetch('/api/sections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, school_year: year, semester: sem })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      createdSectionId = data.section.id;
      qs('#modal-step-1').classList.add('hidden');
      qs('#modal-step-2').classList.remove('hidden');
    } catch(e) {
      errEl.textContent = e.message; errEl.classList.remove('hidden');
    } finally {
      btn.textContent = 'Next: Import Students →'; btn.disabled = false;
    }
  });

  qs('#csv-file').addEventListener('change', (e) => {
    qs('#csv-filename').textContent = e.target.files[0]?.name || 'No file selected';
  });

  qs('#btn-step2-back').addEventListener('click', () => {
    qs('#modal-step-2').classList.add('hidden');
    qs('#modal-step-1').classList.remove('hidden');
  });

  qs('#btn-step2-import').addEventListener('click', async () => {
    const file = qs('#csv-file').files[0];
    const errEl = qs('#step2-error');
    if (!file) { errEl.textContent = 'Please select a CSV file.'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');
    const btn = qs('#btn-step2-import');
    btn.textContent = 'Importing…'; btn.disabled = true;
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`/api/sections/${createdSectionId}/import`, { method: 'POST', body: form });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      qs('#import-summary').textContent = `${data.imported_count} student${data.imported_count !== 1 ? 's' : ''} imported into ${data.group_count} group${data.group_count !== 1 ? 's' : ''}.`;
      if (data.errors && data.errors.length) {
        const errBox = qs('#import-errors');
        errBox.innerHTML = '<p class="font-bold mb-1">Skipped rows:</p>' + data.errors.map(e => `<p>• ${e}</p>`).join('');
        errBox.classList.remove('hidden');
      }
      qs('#modal-step-2').classList.add('hidden');
      qs('#modal-step-3').classList.remove('hidden');
    } catch(e) {
      errEl.textContent = e.message; errEl.classList.remove('hidden');
    } finally {
      btn.textContent = 'Import & Create'; btn.disabled = false;
    }
  });

  qs('#btn-step3-done').addEventListener('click', () => {
    qs('#modal-add-section').classList.add('hidden');
    loadSections();
  });

  // ── Init ─────────────────────────────────────────────────────────────────
  loadSections();
})();
</script>
