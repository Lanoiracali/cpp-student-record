<section class="space-y-6">
  <div class="flex flex-wrap items-end justify-between gap-4">

        </thead>

          <tr class="border-t border-slate-200"><td class="px-4 py-3 font-medium">Sarah Jenkins</td><td class="px-4 py-3">BSCS</td><td class="px-4 py-3">3-1</td><td class="px-4 py-3"><span class="rounded-full bg-emerald-100 px-2 py-1 text-emerald-700">Verified</span></td><td class="px-4 py-3"><button class="btn">Open</button></td></tr>

          <tr class="border-t border-slate-200"><td class="px-4 py-3 font-medium">Amira Khaled</td><td class="px-4 py-3">BSA</td><td class="px-4 py-3">1-1</td><td class="px-4 py-3"><span class="rounded-full bg-sky-100 px-2 py-1 text-sky-700">Pending</span></td><td class="px-4 py-3"><button class="btn">Edit</button></td></tr>
