<!-- Student Index Card — loaded dynamically via window.loadStudentCard(id) -->
<section class="space-y-6" id="student-card-root">
  <div class="flex items-center justify-center py-20 text-slate-400">
    <span class="material-symbols-outlined text-4xl">progress_activity</span>
  </div>
</section>

<script>
(function() {
  // Called from the members list
  window.loadStudentCard = async function(studentId) {
    const root = document.querySelector('#page-body') || document.querySelector('#student-card-root');
    root.innerHTML = `<section class="space-y-6" id="student-card-root">
      <div class="flex items-center justify-center py-20 text-slate-400">
        <span class="material-symbols-outlined animate-spin text-4xl">progress_activity</span>
      </div></section>`;

    try {
      const [stuRes, recRes] = await Promise.all([
        fetch(`/api/students/${studentId}`),
        fetch(`/api/students/${studentId}/records`)
      ]);
      const stuData = await stuRes.json();
      const recData = await recRes.json();
      if (!stuData.success) throw new Error(stuData.error);
      renderCard(stuData.student, recData.records || [], root);
    } catch(e) {
      root.innerHTML = `<div class="text-red-500 p-4">Failed to load student: ${e.message}</div>`;
    }
  };

  function renderCard(s, records, container) {
    const initials = (s.first_name[0] || '') + (s.surname[0] || '');
    const fullName = `${s.surname}, ${s.first_name}${s.middle_initial ? ' ' + s.middle_initial + '.' : ''}`;

    container.innerHTML = `
    <section class="space-y-6" id="student-card-root" data-student-id="${s.id}">

      <!-- Breadcrumb -->
      <div class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
        <button onclick="window.reloadRecords()" class="hover:text-blue-900 font-medium transition-colors">Records</button>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <button onclick="window.loadSectionDetail(${s.section_id}, '')" class="hover:text-blue-900 font-medium transition-colors">${s.section_name}</button>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <button onclick="window.loadGroupDetail(${s.group_id}, '${s.section_name}', ${s.section_id})" class="hover:text-blue-900 font-medium transition-colors">Group ${s.group_number}</button>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <span class="font-bold text-slate-900">${s.first_name} ${s.surname}</span>
      </div>

      <!-- Index Card -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

        <!-- Card Header -->
        <div class="bg-gradient-to-r from-blue-900 to-blue-800 p-5">
          <div class="grid grid-cols-[auto_1fr_auto] gap-4 items-start">

            <!-- Left: Avatar -->
            <div class="w-16 h-16 rounded-full bg-white/20 border-2 border-white/30 flex items-center justify-center text-white font-black text-xl shrink-0">
              ${initials.toUpperCase()}
            </div>

            <!-- Center: Group info -->
            <div class="text-center pt-1">
              <p class="text-blue-200 text-xs font-semibold uppercase tracking-widest">Group ${s.group_number}</p>
              <p class="text-white font-bold text-lg leading-tight mt-0.5">${s.group_name}</p>
              <p class="text-blue-200 text-xs mt-1">${s.section_name}</p>
            </div>

            <!-- Right: Name / Stud# / Section -->
            <div class="text-right pt-1 space-y-0.5">
              <p class="text-white font-bold text-sm leading-tight">${fullName}</p>
              <p class="text-blue-200 text-xs font-mono">${s.stud_number}</p>
              <p class="text-blue-200 text-xs">${s.section_name}</p>
            </div>
          </div>
        </div>

        <!-- Records Table -->
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-slate-800 flex items-center gap-2">
              <span class="material-symbols-outlined text-base text-blue-900">assignment</span>
              Records
              <span class="text-xs font-normal text-slate-400 ml-1" id="rec-count">${records.length} entr${records.length !== 1 ? 'ies' : 'y'}</span>
            </h3>
            <button onclick="window.openRecordModal(${s.id})"
                    class="flex items-center gap-1.5 px-3 py-2 bg-blue-900 text-white text-xs font-bold rounded-xl hover:bg-blue-800 transition-colors">
              <span class="material-symbols-outlined text-sm">add</span>Add Record
            </button>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-sm" id="records-table">
              <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                <tr>
                  <th class="px-4 py-3 text-left">Date</th>
                  <th class="px-4 py-3 text-left">Type</th>
                  <th class="px-4 py-3 text-right">Score</th>
                  <th class="px-4 py-3 text-right">Total</th>
                  <th class="px-4 py-3 text-left">Remarks</th>
                  <th class="px-4 py-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="records-tbody">
                ${records.length === 0 ? `
                <tr><td colspan="6" class="px-4 py-10 text-center text-slate-400 text-sm">
                  No records yet. Click <strong>Add Record</strong> to begin.
                </td></tr>` :
                records.map(r => recordRow(r)).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Record Modal -->
      <div id="record-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
          <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h4 id="record-modal-title" class="font-bold text-slate-900">Add Record</h4>
            <button onclick="document.getElementById('record-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-700">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
          <div class="p-6 space-y-4">
            <input type="hidden" id="rec-edit-id" value=""/>
            <div class="grid grid-cols-2 gap-3">
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Date</label>
                <input id="rec-date" type="date"
                       class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Type</label>
                <input id="rec-type" type="text" placeholder="e.g. Quiz, Lab, Exam"
                       class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Score</label>
                <input id="rec-score" type="number" step="0.01" min="0" placeholder="0"
                       class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Total Score</label>
                <input id="rec-total" type="number" step="0.01" min="0" placeholder="100"
                       class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
              </div>
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Remarks</label>
              <input id="rec-remarks" type="text" placeholder="Optional notes"
                     class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"/>
            </div>
            <div id="rec-modal-error" class="hidden text-sm text-red-600 font-medium"></div>
            <div class="flex gap-3 pt-1">
              <button onclick="document.getElementById('record-modal').classList.add('hidden')"
                      class="flex-1 py-2.5 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors">
                Cancel
              </button>
              <button id="rec-save-btn" onclick="window.saveRecord(${s.id})"
                      class="flex-1 py-2.5 bg-blue-900 text-white text-sm font-bold rounded-xl hover:bg-blue-800 transition-colors">
                Save
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete confirm modal -->
      <div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-4">
          <div class="text-center space-y-2">
            <span class="material-symbols-outlined text-5xl text-red-500" style="font-variation-settings:'FILL' 1">delete_forever</span>
            <h4 class="font-bold text-slate-900">Delete Record?</h4>
            <p class="text-sm text-slate-500">This action cannot be undone.</p>
          </div>
          <div class="flex gap-3">
            <button onclick="document.getElementById('delete-modal').classList.add('hidden')"
                    class="flex-1 py-2.5 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50">Cancel</button>
            <button id="confirm-delete-btn"
                    class="flex-1 py-2.5 bg-red-600 text-white text-sm font-bold rounded-xl hover:bg-red-700">Delete</button>
          </div>
        </div>
      </div>

    </section>`;

    bindCardEvents(s.id, records);
  }

  function recordRow(r) {
    const dateStr = r.date ? r.date.split('T')[0] : '—';
    const score = r.score != null ? r.score : '—';
    const total = r.total_score != null ? `/ ${r.total_score}` : '';
    return `<tr class="border-t border-slate-100 hover:bg-slate-50 transition-colors" id="rec-row-${r.id}">
      <td class="px-4 py-3 text-slate-600 text-xs">${dateStr}</td>
      <td class="px-4 py-3 font-medium">${r.type_of_undertaking}</td>
      <td class="px-4 py-3 text-right font-bold text-blue-900">${score}</td>
      <td class="px-4 py-3 text-right text-slate-500 text-xs">${total}</td>
      <td class="px-4 py-3 text-slate-500 text-xs">${r.remarks || '—'}</td>
      <td class="px-4 py-3 text-center">
        <div class="flex items-center justify-center gap-2">
          <button onclick="window.editRecord(${JSON.stringify(r).replace(/"/g,'&quot;')})"
                  class="p-1.5 rounded-lg hover:bg-blue-50 text-blue-700 transition-colors" title="Edit">
            <span class="material-symbols-outlined text-base">edit</span>
          </button>
          <button onclick="window.deleteRecord(${r.id})"
                  class="p-1.5 rounded-lg hover:bg-red-50 text-red-600 transition-colors" title="Delete">
            <span class="material-symbols-outlined text-base">delete</span>
          </button>
        </div>
      </td>
    </tr>`;
  }

  function bindCardEvents(studentId) {
    // Modal open
    window.openRecordModal = function(sid) {
      document.getElementById('rec-edit-id').value = '';
      document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('rec-type').value = '';
      document.getElementById('rec-score').value = '';
      document.getElementById('rec-total').value = '';
      document.getElementById('rec-remarks').value = '';
      document.getElementById('record-modal-title').textContent = 'Add Record';
      document.getElementById('rec-modal-error').classList.add('hidden');
      document.getElementById('record-modal').classList.remove('hidden');
    };

    window.editRecord = function(r) {
      document.getElementById('rec-edit-id').value = r.id;
      document.getElementById('rec-date').value = r.date ? r.date.split('T')[0] : '';
      document.getElementById('rec-type').value = r.type_of_undertaking || '';
      document.getElementById('rec-score').value = r.score != null ? r.score : '';
      document.getElementById('rec-total').value = r.total_score != null ? r.total_score : '';
      document.getElementById('rec-remarks').value = r.remarks || '';
      document.getElementById('record-modal-title').textContent = 'Edit Record';
      document.getElementById('rec-modal-error').classList.add('hidden');
      document.getElementById('record-modal').classList.remove('hidden');
    };

    window.saveRecord = async function(sid) {
      const editId = document.getElementById('rec-edit-id').value;
      const body = {
        date: document.getElementById('rec-date').value,
        type_of_undertaking: document.getElementById('rec-type').value,
        score: document.getElementById('rec-score').value,
        total_score: document.getElementById('rec-total').value,
        remarks: document.getElementById('rec-remarks').value,
      };
      const errEl = document.getElementById('rec-modal-error');
      const btn = document.getElementById('rec-save-btn');
      if (!body.date || !body.type_of_undertaking || body.score === '') {
        errEl.textContent = 'Date, type, and score are required.';
        errEl.classList.remove('hidden'); return;
      }
      errEl.classList.add('hidden');
      btn.textContent = 'Saving…'; btn.disabled = true;
      try {
        const url = editId ? `/api/records/${editId}` : `/api/students/${sid}/records`;
        const method = editId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        document.getElementById('record-modal').classList.add('hidden');
        // Reload card
        window.loadStudentCard(sid);
      } catch(e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Save'; btn.disabled = false;
      }
    };

    let pendingDeleteId = null;
    window.deleteRecord = function(recId) {
      pendingDeleteId = recId;
      document.getElementById('delete-modal').classList.remove('hidden');
    };

    const confirmBtn = document.getElementById('confirm-delete-btn');
    if (confirmBtn) {
      confirmBtn.onclick = async function() {
        if (!pendingDeleteId) return;
        try {
          const res = await fetch(`/api/records/${pendingDeleteId}`, { method: 'DELETE' });
          const data = await res.json();
          if (!data.success) throw new Error(data.error);
          document.getElementById('delete-modal').classList.add('hidden');
          window.loadStudentCard(studentId);
        } catch(e) {
          alert('Delete failed: ' + e.message);
        }
      };
    }
  }
})();
</script>
