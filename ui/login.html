<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

            "spacing": {

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center px-gutter py-xl">
<div class="w-full max-w-[440px] flex flex-col gap-lg">
<div class="flex flex-col items-center gap-sm mb-base">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">CPP</h1>
</div>
<p class="font-body-md text-body-md text-secondary">Institutional Records Management System</p>
</div>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-xl flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<h2 class="font-display-lg text-display-lg text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-secondary">Enter your administrative credentials to continue.</p>
</div>
<div id="login-message"><!-- AUTH_MESSAGE --></div>
<form class="flex flex-col gap-md" method="POST" action="/login" hx-post="/login" hx-target="#login-message" hx-swap="innerHTML">
<div class="flex gap-md sm:flex-row flex-col">
<div class="flex flex-col gap-sm w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="firstName">First Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-[48px] pl-11 pr-md bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md outline-none transition-all" id="firstName" name="firstName" placeholder="First Name" type="text" required/>
</div>
</div>
<div class="flex flex-col gap-sm w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="lastName">Last Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-[48px] pl-11 pr-md bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md outline-none transition-all" id="lastName" name="lastName" placeholder="Last Name" type="text" required/>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="/register">Create Account</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-11 pr-md bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md outline-none transition-all" id="password" name="password" placeholder="••••••••" type="password" required/>
</div>
</div>
<div class="flex items-center gap-sm py-xs">
<input class="w-5 h-5 rounded border-outline-variant text-tertiary-container focus:ring-tertiary-container cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-secondary cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<button class="w-full h-[48px] bg-tertiary-container text-on-tertiary-container font-headline-sm text-headline-sm rounded-lg hover:bg-tertiary transition-colors flex items-center justify-center gap-sm mt-sm shadow-sm active:scale-[0.98]" type="submit">
                        Sign In
                        <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
</div>
<div class="flex justify-center items-center gap-xl mt-md">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="/register">Create Account</a>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Help Desk</a>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">System Status</a>
</div>
</div>
</main>
<footer class="w-full max-w-[1440px] mx-auto px-gutter py-lg flex justify-between items-center border-t border-outline-variant">
<p class="font-label-md text-label-md text-outline">© 2024 CPP Academic Systems. All rights reserved.</p>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline text-sm" data-icon="verified_user">verified_user</span>
<p class="font-label-md text-label-md text-outline">AES-256 Encrypted Connection</p>
</div>
</footer>
<div class="fixed bottom-0 right-0 p-gutter opacity-10 pointer-events-none select-none">
<img alt="University Logo Watermark" class="w-64 grayscale" data-alt="A faint, high-angle aerial photograph of a prestigious university campus featuring historical brick architecture and lush green quads. The image is highly desaturated and low contrast to serve as a subtle background watermark. The lighting is soft morning sunlight casting long, gentle shadows across the collegiate grounds. The overall aesthetic is one of tradition, stability, and institutional excellence." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmMRMkJvq3nZ4QpKDVqVTxRSbmev22mA8blYmLOt2U-mMFVsV3t_Vj4jgAOSkhDU5PTym3drCTPdvMvMg1n31uURgBzS74ATBwkMYpCTlABoIsTkLm3UHY3aSNk8jWbUVsdPqc4FijVrnyTBzVqrDzsr2ArU_e00Hec9Y95HFtg2D-MO7HD77wzcX1hzwfk8yobjZ4HnsEPw0jpphtalFwr1zaiKmJuCLoj0X_0jksNtVkLjEpSGI6mWoATpmG1JisHaHw5QTvRL7K"/>
</div>
